<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A two-player word convergence game. Take turns naming words, aiming for the middle of the last pair, until you both say the same word.">
  <meta name="theme-color" content="#14120F">

  <!-- Link previews, so a shared room link looks like something in chat apps -->
  <meta property="og:title" content="Naamkaran">
  <meta property="og:description" content="Two minds, one word. Keep naming words until you converge.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Naamkaran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Naamkaran</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches AppTheme.ink so the page never flashes white before Flutter
       paints, and covers the overscroll area on mobile browsers. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #14120F;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F3EADA;
      transition: opacity 0.3s ease;
    }
    #boot .mark {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 6px;
    }
    #boot .note {
      font-size: 11px;
      letter-spacing: 1.4px;
      color: rgba(243, 234, 218, 0.45);
    }
    #boot .bar {
      width: 120px;
      height: 2px;
      background: rgba(243, 234, 218, 0.14);
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      background: #E0A93B;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <!-- Shown until Flutter takes over. The first visit downloads the bundled
       word-vector table, so a plain white screen would look broken. -->
  <div id="boot">
    <div class="mark">NAAMKARAN</div>
    <div class="bar"><span></span></div>
    <div class="note">loading word vectors</div>
  </div>

  <script>
    // This app used to ship a Flutter service worker. It cached everything and
    // kept serving a stale build after each deploy, so it is no longer generated
    // (see --pwa-strategy=none in tools/build_web.sh).
    //
    // A browser that already registered the old worker will keep using it
    // forever unless it is explicitly removed, so evict it and reload once.
    // Without this, anyone who visited before the change would never see an
    // update again.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k);
                }));
              });
            }
          })
          .then(function () {
            // Guarded so a failure to clear can never cause a reload loop.
            if (!sessionStorage.getItem('nk-sw-cleared')) {
              sessionStorage.setItem('nk-sw-cleared', '1');
              location.reload();
            }
          })
          .catch(function () { /* stale worker is not fatal */ });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 320);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
