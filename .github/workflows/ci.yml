name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: firebase_core_web 3.11.0 does not compile for web on this
          # SDK, and the pubspec pins the Firebase set that works with it.
          # Bumping the SDK means re-checking that combination.
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - run: flutter analyze

      # The web build is the one that actually catches Firebase plugin
      # incompatibilities, so it runs on every push rather than only at release.
      - name: Build web
        run: flutter build web --release --pwa-strategy=none
